{% extends "index.html" %}

{%- block title -%}
{{ <terminimal.title page_title={page.title} main_title={config.title} config={config} /> }}
{%- endblock -%}

{% block content %}
    <div class="post">
        <h1 class="post-title">{{ page.title }}</h1>

        {% set section = get_section(path="_index.md") %}

        {{ <terminimal.list_posts pages={section.pages} /> }}
    </div>
{% endblock content %}
