{% extends "index.html" %}

{%- block title -%}
{{ <terminimal.title page_title={page.title} main_title={config.title} config={config} /> }}
{%- endblock -%}

{% block content %}

        {{ <terminimal.post_header page={page} /> }}

    </div>
{% endblock content %}
